<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MealFinder</title>
    <link href="./CSS/style.css" rel="stylesheet" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <!-- header includes nav bar, side bar, banner -->
    <header>
      <!-- nav bar -->
      <nav class="navbar fixed-top custom-nav">
        <div class="container-fluid">
          <a class="navbar-brand" href="./index.html">
            <i class="fa-solid fa-house"></i>
            MEAL FINDER
          </a>
          <!-- toggle button on nav bar -->
          <button
            data-bs-theme="dark"
            class="navbar-toggler"
            type="button"
            data-bs-toggle="offcanvas"
            data-bs-target="#offcanvasNavbar"
            aria-controls="offcanvasNavbar"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <!-- side bar -->
          <div
            class="offcanvas offcanvas-end"
            tabindex="-1"
            id="offcanvasNavbar"
            aria-labelledby="offcanvasNavbarLabel"
          >
            <div class="offcanvas-header">
              <button
                type="button"
                class="btn-close-round"
                data-bs-dismiss="offcanvas"
                aria-label="Close"
              >
                <i class="fa-solid fa-xmark"></i>
              </button>
            </div>
            <!-- sidebar list -->
            <div class="offcanvas-body">
              <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
                <li class="nav-item horz-divider">
                  <a class="nav-link" aria-current="page" href="#">Beef</a>
                </li>
                <li class="nav-item horz-divider">
                  <a class="nav-link" aria-current="page" href="#">Chicken</a>
                </li>
                <li class="nav-item horz-divider">
                  <a class="nav-link" aria-current="page" href="#">Dessert</a>
                </li>
                <li class="nav-item horz-divider">
                  <a class="nav-link" aria-current="page" href="#">Lamb</a>
                </li>
                <li class="nav-item horz-divider">
                  <a class="nav-link" aria-current="page" href="#"
                    >Miscellaneous</a
                  >
                </li>
                <li class="nav-item horz-divider">
                  <a class="nav-link" aria-current="page" href="#">Pasta</a>
                </li>
                <li class="nav-item horz-divider">
                  <a class="nav-link" aria-current="page" href="#">Pork</a>
                </li>
                <li class="nav-item horz-divider">
                  <a class="nav-link" aria-current="page" href="#">Seafood</a>
                </li>
                <li class="nav-item horz-divider">
                  <a class="nav-link" aria-current="page" href="#">Side</a>
                </li>
                <li class="nav-item horz-divider">
                  <a class="nav-link" aria-current="page" href="#">Starter</a>
                </li>
                <li class="nav-item horz-divider">
                  <a class="nav-link" aria-current="page" href="#">Vegan</a>
                </li>
                <li class="nav-item horz-divider">
                  <a class="nav-link" aria-current="page" href="#"
                    >Vegetarian</a
                  >
                </li>
                <li class="nav-item horz-divider">
                  <a class="nav-link" aria-current="page" href="#">Breakfast</a>
                </li>
                <li class="nav-item horz-divider">
                  <a class="nav-link" aria-current="page" href="#">Goat</a>
                </li>
              </ul>
            </div>
          </div>
        </div>
      </nav>

      <!-- banner image and contents -->
      <section>
        <div class="banner-img"></div>
        <!-- search bar -->
        <div class="search-txt">
          <form class="d-flex justify-content-center mt-3 search" role="search">
            <input
              class="form-control me-2 ps-4"
              type="search"
              placeholder="Search recipies here ..."
              aria-label="Search"
            />
            <button class="btn-search" type="submit">
              <i class="fa-solid fa-magnifying-glass"></i>
            </button>
          </form>
          <h1 class="text-white d-flex justify-content-center">
            What are your favourite cuisines?
          </h1>
          <p class="text-white d-flex justify-content-center">
            PERSONALIZE YOUR EXPERIENCE
          </p>
        </div>
      </section>
    </header>
  </body>
</html>
